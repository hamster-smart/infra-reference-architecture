<svg width="680" height="540" viewBox="0 0 680 540" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Scheme 3 — Caddy on port 443, Xray on internal subpath</title>
<desc>Caddy sits on port 443 and handles all TLS. It routes traffic by path: root goes to decoy site, /_matrix/* goes to Synapse, and a secret path proxies to Xray for VPN tunneling. Synapse uses PostgreSQL and Coturn.</desc>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
    .th  { font-size: 14px; font-weight: 500; fill: #3C3489; }
    .ts  { font-size: 12px; font-weight: 400; fill: #534AB7; }
    .th-teal { font-size: 14px; font-weight: 500; fill: #085041; }
    .ts-teal { font-size: 12px; font-weight: 400; fill: #0F6E56; }
    .th-blue { font-size: 14px; font-weight: 500; fill: #0C447C; }
    .ts-blue { font-size: 12px; font-weight: 400; fill: #185FA5; }
    .th-amber { font-size: 14px; font-weight: 500; fill: #633806; }
    .ts-amber { font-size: 12px; font-weight: 400; fill: #854F0B; }
    .th-coral { font-size: 14px; font-weight: 500; fill: #712B13; }
    .ts-coral { font-size: 12px; font-weight: 400; fill: #993C1D; }
    .th-green { font-size: 14px; font-weight: 500; fill: #27500A; }
    .ts-green { font-size: 12px; font-weight: 400; fill: #3B6D11; }
    .th-gray { font-size: 14px; font-weight: 500; fill: #444441; }
    .ts-gray { font-size: 12px; font-weight: 400; fill: #5F5E5A; }
    .lbl { font-size: 11px; font-weight: 400; fill: #888780; }
    .lbl-vpn { font-size: 11px; font-weight: 500; fill: #534AB7; }
  </style>
</defs>

<!-- Three client types -->
<rect x="20"  y="20" width="140" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th-gray" x="90"  y="36" text-anchor="middle" dominant-baseline="central">Browser</text>
<text class="ts-gray" x="90"  y="54" text-anchor="middle" dominant-baseline="central">/ root</text>

<rect x="260" y="20" width="160" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="th-blue" x="340" y="36" text-anchor="middle" dominant-baseline="central">Element / client</text>
<text class="ts-blue" x="340" y="54" text-anchor="middle" dominant-baseline="central">/_matrix/* endpoint</text>

<rect x="520" y="20" width="140" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="590" y="36" text-anchor="middle" dominant-baseline="central">VPN client</text>
<text class="ts" x="590" y="54" text-anchor="middle" dominant-baseline="central">key + secret path</text>

<!-- Arrows to Caddy -->
<line x1="120" y1="64" x2="225" y2="130" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="340" y1="64" x2="340" y2="130" stroke="#185FA5" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="560" y1="64" x2="455" y2="130" stroke="#534AB7" stroke-width="1" marker-end="url(#arrow)"/>

<!-- Caddy -->
<rect x="140" y="130" width="400" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th-teal" x="340" y="150" text-anchor="middle" dominant-baseline="central">Caddy  —  :443</text>
<text class="ts-teal" x="340" y="170" text-anchor="middle" dominant-baseline="central">TLS owner · auto certs · path-based routing</text>

<!-- Three arrows from Caddy -->
<line x1="210" y1="186" x2="110" y2="270" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="340" y1="186" x2="340" y2="270" stroke="#185FA5" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="470" y1="186" x2="560" y2="270" stroke="#534AB7" stroke-width="1" marker-end="url(#arrow)"/>

<text class="lbl" x="138" y="236" text-anchor="middle">/ (proxy ext.)</text>
<text class="lbl" x="355" y="234">/_matrix/*</text>
<text class="lbl-vpn" x="534" y="234" text-anchor="middle">/secret-path/*</text>

<!-- Decoy site -->
<rect x="30"  y="270" width="160" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th-gray" x="110" y="290" text-anchor="middle" dominant-baseline="central">Decoy site</text>
<text class="ts-gray" x="110" y="308" text-anchor="middle" dominant-baseline="central">reverse_proxy external</text>

<!-- Synapse -->
<rect x="250" y="270" width="180" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="th-blue" x="340" y="290" text-anchor="middle" dominant-baseline="central">Matrix Synapse</text>
<text class="ts-blue" x="340" y="308" text-anchor="middle" dominant-baseline="central">synapse:8008 · docker</text>

<!-- Xray internal -->
<rect x="480" y="270" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="570" y="290" text-anchor="middle" dominant-baseline="central">Xray (xhttp / tls)</text>
<text class="ts" x="570" y="308" text-anchor="middle" dominant-baseline="central">internal port · docker</text>

<!-- Arrow: Xray → Internet -->
<line x1="570" y1="326" x2="570" y2="390" stroke="#3B6D11" stroke-width="1" marker-end="url(#arrow)"/>

<!-- Internet -->
<rect x="490" y="390" width="160" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text class="th-green" x="570" y="410" text-anchor="middle" dominant-baseline="central">Internet</text>
<text class="ts-green" x="570" y="428" text-anchor="middle" dominant-baseline="central">VPN tunnel out</text>

<!-- Arrows: Synapse → Postgres + Coturn -->
<line x1="300" y1="326" x2="210" y2="400" stroke="#185FA5" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="380" y1="326" x2="390" y2="400" stroke="#185FA5" stroke-width="1" marker-end="url(#arrow)"/>

<!-- Postgres -->
<rect x="110" y="400" width="180" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text class="th-amber" x="200" y="420" text-anchor="middle" dominant-baseline="central">PostgreSQL</text>
<text class="ts-amber" x="200" y="438" text-anchor="middle" dominant-baseline="central">pg_hba.conf · no ext. port</text>

<!-- Coturn -->
<rect x="310" y="400" width="160" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="th-coral" x="390" y="420" text-anchor="middle" dominant-baseline="central">Coturn (TURN)</text>
<text class="ts-coral" x="390" y="438" text-anchor="middle" dominant-baseline="central">WebRTC · host network</text>

<!-- Legend -->
<line x1="30"  y1="514" x2="58"  y2="514" stroke="#534AB7" stroke-width="1.5"/>
<text class="lbl" x="64" y="514" dominant-baseline="central">VPN traffic</text>
<line x1="160" y1="514" x2="188" y2="514" stroke="#185FA5" stroke-width="1.5"/>
<text class="lbl" x="194" y="514" dominant-baseline="central">Matrix traffic</text>
<line x1="300" y1="514" x2="328" y2="514" stroke="#888780" stroke-width="1.5"/>
<text class="lbl" x="334" y="514" dominant-baseline="central">HTTP / web</text>
<line x1="420" y1="514" x2="448" y2="514" stroke="#3B6D11" stroke-width="1.5"/>
<text class="lbl" x="454" y="514" dominant-baseline="central">tunnel out</text>
</svg>
