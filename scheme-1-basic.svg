<svg width="680" height="480" viewBox="0 0 680 480" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Scheme 1 — Basic Matrix/Synapse deployment without VPN</title>
<desc>Caddy on port 443 acts as reverse proxy routing traffic to Matrix Synapse, a decoy site, and optional Synapse Admin panel. Synapse stores data in PostgreSQL and uses Coturn for WebRTC calls.</desc>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
    .th  { font-size: 14px; font-weight: 500; fill: #3C3489; }
    .ts  { font-size: 12px; font-weight: 400; fill: #534AB7; }
    .th-teal { font-size: 14px; font-weight: 500; fill: #085041; }
    .ts-teal { font-size: 12px; font-weight: 400; fill: #0F6E56; }
    .th-blue { font-size: 14px; font-weight: 500; fill: #0C447C; }
    .ts-blue { font-size: 12px; font-weight: 400; fill: #185FA5; }
    .th-amber { font-size: 14px; font-weight: 500; fill: #633806; }
    .ts-amber { font-size: 12px; font-weight: 400; fill: #854F0B; }
    .th-coral { font-size: 14px; font-weight: 500; fill: #712B13; }
    .ts-coral { font-size: 12px; font-weight: 400; fill: #993C1D; }
    .th-gray { font-size: 14px; font-weight: 500; fill: #444441; }
    .ts-gray { font-size: 12px; font-weight: 400; fill: #5F5E5A; }
    .lbl { font-size: 11px; font-weight: 400; fill: #888780; }
  </style>
</defs>

<!-- Client -->
<rect x="230" y="20" width="220" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="340" y="36" text-anchor="middle" dominant-baseline="central">Client</text>
<text class="ts" x="340" y="54" text-anchor="middle" dominant-baseline="central">browser / Element app</text>

<!-- Arrow: client → caddy -->
<line x1="340" y1="64" x2="340" y2="106" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
<text class="lbl" x="350" y="90" dominant-baseline="central">:443 / :80  TLS</text>

<!-- Caddy -->
<rect x="150" y="106" width="380" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th-teal" x="340" y="126" text-anchor="middle" dominant-baseline="central">Caddy — reverse proxy</text>
<text class="ts-teal" x="340" y="148" text-anchor="middle" dominant-baseline="central">:443 · :80 · TLS termination · auto certificates</text>

<!-- Arrow: Caddy → Decoy site -->
<line x1="220" y1="162" x2="130" y2="240" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
<text class="lbl" x="148" y="208" text-anchor="middle">/ (root)</text>

<!-- Arrow: Caddy → Synapse -->
<line x1="340" y1="162" x2="340" y2="240" stroke="#1D9E75" stroke-width="1" marker-end="url(#arrow)"/>
<text class="lbl" x="352" y="206">/_matrix/*</text>

<!-- Arrow: Caddy → Admin (dashed) -->
<line x1="460" y1="162" x2="540" y2="240" stroke="#888780" stroke-width="1" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
<text class="lbl" x="516" y="208" text-anchor="middle">:8081 opt.</text>

<!-- Decoy site -->
<rect x="50" y="240" width="160" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th-gray" x="130" y="260" text-anchor="middle" dominant-baseline="central">Decoy site</text>
<text class="ts-gray" x="130" y="278" text-anchor="middle" dominant-baseline="central">domain masking</text>

<!-- Synapse -->
<rect x="250" y="240" width="180" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="th-blue" x="340" y="260" text-anchor="middle" dominant-baseline="central">Matrix Synapse</text>
<text class="ts-blue" x="340" y="278" text-anchor="middle" dominant-baseline="central">:8008 · homeserver.yaml</text>

<!-- Synapse Admin (optional) -->
<rect x="460" y="240" width="170" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5" stroke-dasharray="6 3"/>
<text class="th" x="545" y="256" text-anchor="middle" dominant-baseline="central">Synapse Admin</text>
<text class="ts" x="545" y="274" text-anchor="middle" dominant-baseline="central">optional · etkecc image</text>

<!-- Arrow: Synapse → Postgres -->
<line x1="300" y1="296" x2="210" y2="370" stroke="#185FA5" stroke-width="1" marker-end="url(#arrow)"/>

<!-- Arrow: Synapse → Coturn -->
<line x1="380" y1="296" x2="450" y2="370" stroke="#185FA5" stroke-width="1" marker-end="url(#arrow)"/>

<!-- Postgres -->
<rect x="120" y="370" width="180" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text class="th-amber" x="210" y="390" text-anchor="middle" dominant-baseline="central">PostgreSQL</text>
<text class="ts-amber" x="210" y="408" text-anchor="middle" dominant-baseline="central">pg_hba.conf · docker-only</text>

<!-- Coturn -->
<rect x="370" y="370" width="180" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="th-coral" x="460" y="390" text-anchor="middle" dominant-baseline="central">Coturn (TURN)</text>
<text class="ts-coral" x="460" y="408" text-anchor="middle" dominant-baseline="central">WebRTC calls · host network</text>

<!-- Federation note -->
<rect x="570" y="300" width="90" height="38" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 2"/>
<text class="lbl" x="615" y="315" text-anchor="middle" dominant-baseline="central">:8448</text>
<text class="lbl" x="615" y="328" text-anchor="middle" dominant-baseline="central">federation opt.</text>
<line x1="545" y1="270" x2="570" y2="308" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 2"/>

<!-- Legend -->
<line x1="50" y1="450" x2="80" y2="450" stroke="#1D9E75" stroke-width="1.5"/>
<text class="lbl" x="86" y="450" dominant-baseline="central">Matrix traffic</text>
<line x1="180" y1="450" x2="210" y2="450" stroke="#888780" stroke-width="1.5"/>
<text class="lbl" x="216" y="450" dominant-baseline="central">HTTP / web</text>
<line x1="310" y1="450" x2="340" y2="450" stroke="#888780" stroke-width="1.5" stroke-dasharray="5 3"/>
<text class="lbl" x="346" y="450" dominant-baseline="central">optional</text>
</svg>
