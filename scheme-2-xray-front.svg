<svg width="680" height="500" viewBox="0 0 680 500" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Scheme 2 — Xray/3x-ui on port 443, Caddy on port 8443</title>
<desc>Xray occupies port 443 as TLS terminator and frontend proxy. Clients with a valid VPN key get a tunnel to the internet. Clients without a key are sent via fallback to Caddy on port 8443, which routes to Synapse or the decoy site.</desc>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
    .th  { font-size: 14px; font-weight: 500; fill: #3C3489; }
    .ts  { font-size: 12px; font-weight: 400; fill: #534AB7; }
    .th-teal { font-size: 14px; font-weight: 500; fill: #085041; }
    .ts-teal { font-size: 12px; font-weight: 400; fill: #0F6E56; }
    .th-blue { font-size: 14px; font-weight: 500; fill: #0C447C; }
    .ts-blue { font-size: 12px; font-weight: 400; fill: #185FA5; }
    .th-green { font-size: 14px; font-weight: 500; fill: #27500A; }
    .ts-green { font-size: 12px; font-weight: 400; fill: #3B6D11; }
    .th-gray { font-size: 14px; font-weight: 500; fill: #444441; }
    .ts-gray { font-size: 12px; font-weight: 400; fill: #5F5E5A; }
    .lbl { font-size: 11px; font-weight: 400; fill: #888780; }
    .lbl-vpn { font-size: 11px; font-weight: 500; fill: #534AB7; }
  </style>
</defs>

<!-- Client -->
<rect x="230" y="20" width="220" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th-gray" x="340" y="36" text-anchor="middle" dominant-baseline="central">Client</text>
<text class="ts-gray" x="340" y="54" text-anchor="middle" dominant-baseline="central">browser / Element / VPN client</text>

<!-- Arrow: client → Xray -->
<line x1="340" y1="64" x2="340" y2="106" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
<text class="lbl" x="350" y="90" dominant-baseline="central">:443  TLS</text>

<!-- Xray -->
<rect x="140" y="106" width="400" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="340" y="126" text-anchor="middle" dominant-baseline="central">Xray / 3x-ui  —  :443</text>
<text class="ts" x="340" y="148" text-anchor="middle" dominant-baseline="central">TLS terminator · SNI routing · traffic classification</text>

<!-- Arrow: Xray → VPN tunnel -->
<line x1="230" y1="162" x2="130" y2="250" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="lbl-vpn" x="142" y="215" text-anchor="middle">VPN key ✓</text>

<!-- Arrow: Xray → Caddy (fallback) -->
<line x1="450" y1="162" x2="530" y2="250" stroke="#888780" stroke-width="1" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
<text class="lbl" x="524" y="210" text-anchor="middle">no key →</text>
<text class="lbl" x="524" y="222" text-anchor="middle">fallback</text>

<!-- VPN tunnel box -->
<rect x="40" y="250" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="130" y="270" text-anchor="middle" dominant-baseline="central">VPN tunnel</text>
<text class="ts" x="130" y="288" text-anchor="middle" dominant-baseline="central">open · routed to internet</text>

<!-- Caddy on 8443 -->
<rect x="390" y="250" width="250" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th-teal" x="515" y="270" text-anchor="middle" dominant-baseline="central">Caddy  —  :8443</text>
<text class="ts-teal" x="515" y="288" text-anchor="middle" dominant-baseline="central">127.0.0.1:8443:443 · proxy only</text>

<!-- Arrow: VPN → Internet -->
<line x1="130" y1="306" x2="130" y2="380" stroke="#3B6D11" stroke-width="1" marker-end="url(#arrow)"/>

<!-- Internet -->
<rect x="50" y="380" width="160" height="44" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text class="th-green" x="130" y="396" text-anchor="middle" dominant-baseline="central">Internet</text>
<text class="ts-green" x="130" y="414" text-anchor="middle" dominant-baseline="central">bypass blocks</text>

<!-- Arrow: Caddy → Synapse -->
<line x1="460" y1="306" x2="400" y2="380" stroke="#1D9E75" stroke-width="1" marker-end="url(#arrow)"/>
<text class="lbl" x="410" y="350" text-anchor="middle">/_matrix/*</text>

<!-- Arrow: Caddy → Decoy -->
<line x1="570" y1="306" x2="590" y2="380" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
<text class="lbl" x="600" y="350">/ root</text>

<!-- Synapse -->
<rect x="300" y="380" width="180" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="th-blue" x="390" y="400" text-anchor="middle" dominant-baseline="central">Matrix Synapse</text>
<text class="ts-blue" x="390" y="418" text-anchor="middle" dominant-baseline="central">:8008 · x_forwarded: true</text>

<!-- Decoy -->
<rect x="510" y="380" width="150" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th-gray" x="585" y="400" text-anchor="middle" dominant-baseline="central">Decoy site</text>
<text class="ts-gray" x="585" y="418" text-anchor="middle" dominant-baseline="central">domain masking</text>

<!-- docker-compose note -->
<text class="lbl" x="340" y="476" text-anchor="middle">docker-compose port mapping for Caddy:  127.0.0.1:8443:443</text>
</svg>
